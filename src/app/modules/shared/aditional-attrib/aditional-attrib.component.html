<div>
    <div>
        <button class="btn btn-warning m-2">
            Agregar campo
        </button>
    </div>
    <div>
        <div class="h4">
            <!-- TITULO-->
             Definici&oacute;n de nuevo control
        </div>
        <div>
            <!--TIPO DE CONTROL-->
            <label for="tipocontrolid">Tipo de control</label>
            <select class="form-select" name="tipocontrol" id="tipocontrolid">
                <option [value]="''">Selecciona el tipo de control...</option>
                <option [value]="'text'">Texto</option>
                <option [value]="'select'">Lista de opciones</option>
                <option [value]="'check'">Opci&oacute;n</option>
            </select>
        </div>
        <div>
            <!-- ETIQUETA DEL CONTROL -->
             <label for="etiquetaid">Etiqueta del control</label>
             <input class="form-control" type="text" name="etiquetaname" id="etiquetaid" placeholder="Ingresa el texto de la etiqueta">
        </div>
        <div class="form-control mt-3">
            <!-- VALIDACIONES DEL CONTROL -->
             <div class="h5">
                Validaciones
             </div>
             <div class="form-check">
                <input class="form-check-input" type="checkbox" name="requeridoname" id="requeridoid">
                <label class="form-check-label" for="requeridoid"> Requerido </label>
             </div>
             <div class="input-group mt-2">
                <div class="input-group-text">
                    <input class="form-check-input" type="checkbox" name="lminimaname" id="lminimaid">
                </div>
                <input class="form-control" type="text" name="longitudvaluename" id="longitudvalueid" placeholder="Longitud mínima" >
             </div>
             <div class="input-group mt-2">
                <div class="input-group-text">
                    <input class="form-check-input" type="checkbox" name="lmaximaname" id="lmaximaid">
                </div>
                <input class="form-control" type="text" name="longitudvaluename" id="longitudvalueid" placeholder="Longitud máxima" >
             </div>
             <div class="input-group mt-2">
                <div class="input-group-text">
                    <input class="form-check-input" type="checkbox" name="lregexname" id="lregexid">
                </div>
                <input class="form-control" type="text" name="longitudvaluename" id="longitudvalueid" placeholder="Regex" >
             </div>
        </div>
    </div>
</div>
