<div class="d-flex flex-column w-75">
    <div class="h2">
        Lista de pa&iacute;ses registrados
    </div>
    <div>
        <app-newcountry (loadTableEvent)="loadTable()"></app-newcountry>
        <!-- <button class="btn btn-success" type="button">Nuevo pa&iacute;s</button> -->
    </div>
    <div class="d-flex justify-content-center">
        <table class="table">
            <thead>
                <th>Pa&iacute;s</th>
                <th>Acr&oacute;nimo</th>
                <th>C&oacute;digo de pa&iacute;s</th>
                <th>Continente</th>
                <th class="text-end">Opciones</th>
            </thead>
            <tbody>
                <ng-container *ngIf="statusData==='init'">
                    <!-- Cargando: cuando el componente aún no haya cargado la información de los países -->
                     <tr>
                        <td colspan="4" class="text-center">Cargando pa&iacute;ses...</td>
                     </tr>
                </ng-container>
                <ng-container *ngIf="statusData=='success'">
                    <!-- Cargado - Con datos: Cuando el componente tiene información -->
                     <tr *ngFor="let country of counstries">
                        <td> {{ country.name }}</td>
                        <td> {{ country.acronym }}</td>
                        <td> {{ country.countryCode }} </td>
                        <td> {{ country.continent }} </td>
                        <td class="text-end">
                            <button class="btn btn-primary mx-1" type="button" data-bs-toggle="modal"
                                 [attr.data-bs-target]="'#countryup'" (click)="selectCountryUpdate(country)" ><i class="fa fa-pencil"></i> </button> 
                            <button class="btn btn-danger" type="button" data-bs-toggle="modal" data-bs-target="#deleteCountryModal" (click)="dataToDeleteCountry(country._id!)"> <i class="fa fa-trash"></i> </button>
                        </td>
                     </tr>
                </ng-container>
                <ng-container *ngIf="statusData=='empty'">
                    <!-- Vacío: Cuando no existen datos para mostrar -->
                    <tr>
                        <td colspan="4" class="text-center">Sin pa&iacute;ses registrads</td>
                     </tr>
                </ng-container>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" [id]="'countryup'" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div class="h2">
                    Pa&iacute;ses
                </div>
            </div>
            <div class="modal-body">
                <!-- ATRIBUTOS DEL FORMULARIO -->
                <form>
                    <div>
                        <label for="nameid">Nombre:</label>
                        <input class="form-control" type="text" [(ngModel)]="nameUpdated" name="namename" id="nameid">
                    </div>
                    <div>
                        <label for="acronymid">Acr&oacute;nimo:</label>
                        <input class="form-control" type="text" [(ngModel)]="acronymUpdated" name="acronymname"
                            id="acronymid">
                    </div>
                    <div>
                        <label for="countryCodeid">C&oacute;digo de pa&iacute;s:</label>
                        <input class="form-control" type="text" [(ngModel)]="countryCodeUpdated" name="contryCodename"
                            id="countryCodeid">
                    </div>
                    <div>
                        <label for="continentid">Continente:</label>
                        <select [(ngModel)]="continentUpdated" class="form-select" name="continentname" id="continentid">
                            <option value="">Seleccione un continente</option>
                            <option value="América">Am&eacute;rica</option>
                            <option value="Asia">Asia</option>
                            <option value="Europa">Europa</option>
                            <option value="Africa">&Aacute;frica</option>
                            <option value="Oceania">Oceania</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"  data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary"  (click)="updateCountry()" data-bs-dismiss="modal">Guardar</button>
            </div>
        </div>
    </div>
</div>
  
  <!-- Modal -->
<div class="modal fade" id="deleteCountryModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
<div class="modal-dialog">
    <div class="modal-content">
    <div class="modal-header">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">Eliminación de país</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        ¿Está seguro de eliminar al país seleccionado?
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="deleteCountry()">Eliminar</button>
    </div>
    </div>
</div>
</div>
