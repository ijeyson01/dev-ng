<div class="d-flex flex-column w-75">
    <div class="h2">
        Lista de pa&iacute;ses registrados
    </div>
    <div>
        <app-newcountry></app-newcountry>
        <!-- <button class="btn btn-success" type="button">Nuevo pa&iacute;s</button> -->
    </div>
    <div class="d-flex justify-content-center">
        <table class="table">
            <thead>
                <th>Pa&iacute;s</th>
                <th>Acr&oacute;nimo</th>
                <th>C&oacute;digo de pa&iacute;s</th>
                <th>Continente</th>
                <th class="text-end">Opciones</th>
            </thead>
            <tbody>
                <ng-container *ngIf="statusData==='init'">
                    <!-- Cargando: cuando el componente aún no haya cargado la información de los países -->
                     <tr>
                        <td colspan="4" class="text-center">Cargando pa&iacute;ses...</td>
                     </tr>
                </ng-container>
                <ng-container *ngIf="statusData=='success'">
                    <!-- Cargado - Con datos: Cuando el componente tiene información -->
                     <tr *ngFor="let country of counstries">
                        <td> {{ country.name }}</td>
                        <td> {{ country.acronym }}</td>
                        <td> {{ country.countryCode }} </td>
                        <td> {{ country.continent }} </td>
                        <td class="text-end">
                            <button class="btn btn-primary mx-1" type="button"><i class="fa fa-pencil"></i> </button> 
                            <button class="btn btn-danger" type="button"> <i class="fa fa-trash"></i> </button>
                        </td>
                     </tr>
                </ng-container>
                <ng-container *ngIf="statusData=='empty'">
                    <!-- Vacío: Cuando no existen datos para mostrar -->
                    <tr>
                        <td colspan="4" class="text-center">Sin pa&iacute;ses registrads</td>
                     </tr>
                </ng-container>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" [id]="'country'" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div class="h2">
                    Pa&iacute;ses
                </div>
            </div>
            <div class="modal-body">
                <!-- ATRIBUTOS DEL FORMULARIO -->
                <form [formGroup]="frmCountryRx">
                    <div>
                        <label for="nameid">Nombre:</label>
                        <input class="form-control" type="text" formControlName="name" name="namename" id="nameid">
                    </div>
                    <div>
                        <label for="acronymid">Acr&oacute;nimo:</label>
                        <input class="form-control" type="text" formControlName="acronym" name="acronymname"
                            id="acronymid">
                    </div>
                    <div>
                        <label for="countryCodeid">C&oacute;digo de pa&iacute;s:</label>
                        <input class="form-control" type="text" formControlName="countryCode" name="contryCodename"
                            id="countryCodeid">
                    </div>
                    <div>
                        <label for="continentid">Continente:</label>
                        <select formControlName="continent" class="form-select" name="continentname" id="continentid">
                            <option value="">Seleccione un continente</option>
                            <option value="America">Am&eacute;rica</option>
                            <option value="Asia">Asia</option>
                            <option value="Europa">Europa</option>
                            <option value="Africa">&Aacute;frica</option>
                            <option value="Oceania">Oceania</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"  data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary"  (click)="updateCountry()" data-bs-dismiss="modal">Guardar</button>
            </div>
        </div>
    </div>
</div>
